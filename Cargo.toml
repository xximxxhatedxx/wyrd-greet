[package]
name = "wyrd-greet"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["xximxxhatedxx <ghostr210305@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Standalone Wayland session locker (ext-session-lock-v1 + PAM) and greetd display manager greeter for the Wyrd ecosystem"
repository = "https://github.com/xximxxhatedxx/wyrd-greet"
homepage = "https://github.com/xximxxhatedxx/wyrd-greet"
readme = "README.md"

[[bin]]
name = "wyrd-greet"
path = "src/main.rs"

[features]
default = ["lock-mode", "greet-mode"]
lock-mode = []
greet-mode = []

[dependencies]
wyrd-engine       = { git = "https://github.com/xximxxhatedxx/wyrd-engine", tag = "v0.1.0" }
tiny-skia         = "0.12"
libc              = "0.2"
wayland-client    = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow            = "1"
log               = "0.4"
env_logger        = "0.11"
toml              = "0.8"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
zeroize           = { version = "1.7", features = ["derive"] }
xkbcommon         = "0.9"
chrono            = { version = "0.4", features = ["clock"] }
clap              = { version = "4", features = ["derive"] }
cosmic-text       = "0.19"
mlua              = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
image             = "0.25"
