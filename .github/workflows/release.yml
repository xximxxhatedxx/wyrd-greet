name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev libpam0g-dev

      - name: Build and Package Tarball
        run: |
          cargo build --release --locked
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="wyrd-greet-v${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG}/bin"
          strip -s target/release/wyrd-greet -o "dist/${PKG}/bin/wyrd-greet" || cp target/release/wyrd-greet "dist/${PKG}/bin/wyrd-greet"
          cp README.md CHANGELOG.md SECURITY.md LICENSE install.sh uninstall.sh "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          (cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wyrd-greet-*.tar.gz
            dist/wyrd-greet-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
