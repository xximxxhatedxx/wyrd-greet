name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev libpam0g-dev

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check dependencies
        run: cargo machete --with-metadata

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --locked --all-targets --all-features

      - name: Reject unsupported partial feature profiles
        run: |
          for features in greet-mode lock-mode ""; do
            if [ -n "$features" ]; then
              set -- --features "$features"
            else
              set --
            fi
            if cargo check --locked --no-default-features "$@" >feature-check.log 2>&1; then
              echo "Expected a compile error for partial feature profile: ${features:-none}" >&2
              exit 1
            fi
            grep -F 'requires both `lock-mode` and `greet-mode`' feature-check.log
          done

      - name: Run tests
        run: cargo test --locked --all-targets --all-features --verbose

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90 toolchain
        uses: dtolnay/rust-toolchain@1.90

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev libpam0g-dev

      - name: Cargo check on MSRV
        run: cargo check --locked --all-targets --all-features
